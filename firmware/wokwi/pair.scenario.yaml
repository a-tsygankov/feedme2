name: 'unpair from the system menu returns to pair and pairs again'
version: 1
author: 'feedme2'
# Starts like boot. A menu unpair clears the token and the cached house with its ETag (the same
# wipe as a server 401), so the re-pair's first GET is unconditional and the state lands as changed.
steps:
  - wait-serial: '[feedme2] boot ok'
  - wait-serial: '[feedme2] screen=pair'
  - wait-serial: '[feedme2] pair start code=424242'
  - wait-serial: '[feedme2] paired house='
  - wait-serial: '[feedme2] screen=idle'
  - wait-serial: '[feedme2] sync ok accepted=0 state=changed'
  - wait-serial: '[feedme2] idle cat=Mochi level='
  - write-serial: "long\n"
  - wait-serial: '[feedme2] screen=system'
  - write-serial: "cw\n"
  - delay: 200
  - write-serial: "press\n"
  - wait-serial: '[feedme2] screen=unpair'
  - write-serial: "long\n"
  - wait-serial: '[feedme2] unpaired by=menu'
  - wait-serial: '[feedme2] screen=pair'
  - wait-serial: '[feedme2] pair start code=424242'
  - wait-serial: '[feedme2] paired house='
  - wait-serial: '[feedme2] screen=idle'
  - wait-serial: '[feedme2] sync ok accepted=0 state=changed'
